[flake8]
max-line-length = 79
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    .mypy_cache,
    .pytest_cache

[mypy]
python_version = 3.10
files = pacman, tests, pac-man.py
scripts_are_modules = True
exclude = (^build/|^dist/)

[mypy-pygame.*]
ignore_missing_imports = True

[mypy-mazegenerator.*]
ignore_missing_imports = True

[tool:pytest]
testpaths = tests
